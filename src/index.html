<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markly</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="theme-init.js"></script>
</head>
<body>
  <header id="mk-bar">
    <div class="bar-group">
      <button class="icon-btn" id="btn-toc" title="Table of contents (Ctrl+\)" aria-label="Table of contents">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
      </button>
      <button class="icon-btn" id="btn-files" title="Folder browser (Ctrl+Shift+E)" aria-label="Folder browser" aria-pressed="false">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.2"/><path d="M14.5 4.5v15M16.8 8.5h1.4M16.8 11.5h1.4M16.8 14.5h1.4"/></svg>
      </button>
      <button class="icon-btn" id="btn-open" title="Open file (Ctrl+O)" aria-label="Open">
        <svg viewBox="0 0 24 24"><path d="M3 7.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9.5a2 2 0 0 0-2-2h-7l-2-2.5H5a2 2 0 0 0-2 2z"/></svg>
      </button>
      <div class="menu-wrap">
        <button class="icon-btn" id="btn-recent" title="Recent files" aria-label="Recent files">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        </button>
        <div class="menu" id="recent-menu" hidden></div>
      </div>
    </div>
    <div class="bar-title" id="doc-title"><span class="doc-name">Markly</span><span class="doc-dir" id="doc-dir"></span></div>
    <div class="bar-group">
      <button class="icon-btn" id="btn-find" title="Find (Ctrl+F)" aria-label="Find">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      </button>
      <div class="menu-wrap">
        <button class="icon-btn" id="btn-copy" title="Copy path or content" aria-label="Copy" aria-haspopup="menu" aria-expanded="false" disabled>
          <svg class="ic-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2.2"/><path d="M15.5 8.5V6.2A2.2 2.2 0 0 0 13.3 4H6.2A2.2 2.2 0 0 0 4 6.2v7.1a2.2 2.2 0 0 0 2.2 2.2h2.3"/></svg>
          <svg class="ic-done" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
        </button>
        <div class="menu menu-copy" id="copy-menu" role="menu" hidden>
          <button class="copy-item" id="copy-path" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M6 3.5h7.5L18 8v12.5H6z"/><path d="M13.5 3.5V8H18"/></svg>
            <span class="ci-text"><span class="ci-label">Copy path</span><span class="ci-sub" id="copy-path-sub"></span></span>
            <span class="ci-key" id="copy-path-key">Ctrl+Shift+C</span>
          </button>
          <button class="copy-item" id="copy-content" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M5 6h14M5 10h14M5 14h9M5 18h6"/></svg>
            <span class="ci-text"><span class="ci-label">Copy content</span><span class="ci-sub" id="copy-content-sub">Markdown source</span></span>
          </button>
        </div>
      </div>
      <div class="zoom">
        <button class="icon-btn" id="btn-zoom-out" title="Zoom out (Ctrl+-)" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <button class="zoom-label" id="btn-zoom-reset" title="Reset zoom (Ctrl+0)">100%</button>
        <button class="icon-btn" id="btn-zoom-in" title="Zoom in (Ctrl++)" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
      </div>
      <button class="icon-btn" id="btn-print" title="Print / Save as PDF (Ctrl+P)" aria-label="Print">
        <svg viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v6.5H7z"/></svg>
      </button>
      <button class="icon-btn" id="btn-theme" title="Theme" aria-label="Theme">
        <svg class="ic-system" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17A8.5 8.5 0 0 0 12 3.5z" fill="currentColor"/></svg>
        <svg class="ic-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        <svg class="ic-dark" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <div id="mk-findbar" hidden>
    <input id="find-input" type="text" placeholder="Find in document" spellcheck="false" autocomplete="off">
    <span id="find-count"></span>
    <button class="icon-btn" id="find-prev" title="Previous (Shift+Enter)" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
    <button class="icon-btn" id="find-next" title="Next (Enter)" aria-label="Next"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="icon-btn" id="find-close" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>

  <div id="mk-layout">
    <nav id="mk-toc" aria-label="Table of contents">
      <div class="toc-head">On this page</div>
      <div id="toc-list"></div>
    </nav>
    <main id="mk-scroller">
      <section id="mk-welcome" hidden>
        <div class="welcome-card">
          <div class="welcome-logo">
            <svg viewBox="0 0 64 64"><defs><linearGradient id="wg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="15" fill="url(#wg)"/><path d="M14 44V20l9 11 9-11v24" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M45 20v22m-6.5-6.5L45 42l6.5-6.5" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <h1>Markly</h1>
          <p class="welcome-sub">A fast, quiet Markdown viewer.</p>
          <button class="primary-btn" id="welcome-open">Open a Markdown file…</button>
          <p class="welcome-hint">or drop a <code>.md</code> file anywhere in this window</p>
          <div id="welcome-recent"></div>
          <div class="welcome-keys">
            <span><kbd>Ctrl</kbd><kbd>O</kbd> Open</span>
            <span><kbd>Ctrl</kbd><kbd>F</kbd> Find</span>
            <span><kbd>Ctrl</kbd><kbd>\</kbd> Contents</span>
            <span><kbd>Ctrl</kbd><kbd>+</kbd><kbd>−</kbd> Zoom</span>
            <span><kbd>Ctrl</kbd><kbd>P</kbd> Print / PDF</span>
          </div>
        </div>
      </section>
      <article id="mk-content" class="markdown-body"></article>
    </main>
  </div>

  <div id="mk-drop" hidden><div class="drop-inner">Drop to open</div></div>
  <div id="mk-toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
