name: Release

# Push a tag like v1.1.0 to build Windows, Linux and macOS packages and publish a GitHub release.
# To rebuild an existing tag (assets with the same names are replaced):
#   gh workflow run release.yml --ref main -f tag=v1.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  # The tag being released: the dispatch input, or the pushed tag.
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Find or create the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/git/ref/tags/$TAG" --silent; then
            echo "::error::Tag $TAG does not exist in $REPO"
            exit 1
          fi

          is_id() { [[ "${1:-}" =~ ^[0-9]+$ ]]; }

          # Published releases are found directly by tag; drafts only show up in the list.
          find_release() {
            local id
            if id=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.id' 2>/dev/null) && is_id "$id"; then
              echo "$id"; return 0
            fi
            id=$(gh api --paginate "repos/$REPO/releases?per_page=100" \
                   --jq ".[] | select(.tag_name == \"$TAG\") | .id" 2>/dev/null | head -n1 || true)
            if is_id "$id"; then echo "$id"; return 0; fi
            return 1
          }

          id=""
          for attempt in 1 2 3; do
            if id=$(find_release); then break; fi
            id=""
            [ "$attempt" -lt 3 ] && sleep 5
          done

          if [ -n "$id" ]; then
            echo "Reusing existing release $id for $TAG"
          else
            notes="See [CHANGELOG.md](https://github.com/$REPO/blob/$TAG/CHANGELOG.md). The binaries are not code-signed; see the README for first-run instructions on Windows and macOS."
            if id=$(gh api -X POST "repos/$REPO/releases" \
                      -f tag_name="$TAG" -f name="Markly $TAG" -f body="$notes" \
                      -F draft=true --jq '.id') && is_id "$id"; then
              echo "Created draft release $id for $TAG"
            else
              # Creation can fail if a release appeared in the meantime; look it up once more.
              id=""
              for attempt in 1 2 3 4 5; do
                sleep 5
                if id=$(find_release); then break; fi
                id=""
              done
            fi
          fi

          if ! is_id "$id"; then
            echo "::error::Could not find or create a release for $TAG"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ''
          - name: linux
            os: ubuntu-22.04
            args: ''
          - name: macos
            os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check the tag matches the app version
        shell: bash
        run: |
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$ver" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $ver in src-tauri/tauri.conf.json"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - run: npm ci

      # Builds the bundles and uploads them to the release. tauri-action deletes an existing
      # asset with the same name before uploading, so rebuilding a tag replaces its files.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Upload portable Windows exe
        if: matrix.name == 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/target/release/Markly.exe "Markly_${ver}_x64_portable.exe"
          gh release upload "$TAG" "Markly_${ver}_x64_portable.exe" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      # By id, because drafts cannot be looked up by tag. A no-op for an already published release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -F draft=false --jq '"Published \(.html_url) (draft=\(.draft))"'
