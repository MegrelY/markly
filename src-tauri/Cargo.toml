[package]
name = "markly"
version = "1.0.0"
description = "Markly - a lightweight, beautiful Markdown viewer"
authors = ["Yosef Megrel"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"  # smallest binary; same idle memory as "s"/"3" in measurements (see README)
panic = "abort"
strip = true
